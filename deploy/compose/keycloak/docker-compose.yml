services:
  postgres_keycloak:
    image: ${KEYCLOAK_POSTGRES_IMAGE}
    container_name: ${KEYCLOAK_POSTGRES_CONTAINER_NAME} # Имя контейнера базы данных Keycloak
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER} # Пользователь базы данных из .env
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD} # Пароль базы данных из .env
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB} # Keycloak сам создаст схему при первом старте
    ports:
      - "${KEYCLOAK_POSTGRES_PORT}:5432" # Пробрасываем порт: внешний из .env, внутренний фиксированный
    volumes:
      - kc_pgdata:/var/lib/postgresql # Volume для сохранности данных базы
    healthcheck: # Проверяем "здоровье" контейнера базы
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER} -d ${KEYCLOAK_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped # Автоматический перезапуск контейнера, кроме ручной остановки
    networks:
      - keycloak-network

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    container_name: ${KEYCLOAK_CONTAINER_NAME} # Имя контейнера сервера авторизации
    command: ["start-dev"] # Dev-режим: HTTP без TLS, без строгой проверки hostname
    env_file:
      - .env
    environment:
      # --- Подключение к БД ---
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak # DNS-имя сервиса внутри keycloak-network
      KC_DB_URL_PORT: 5432 # Внутренний порт Postgres, не пробрасываемый
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      # --- Первичный администратор (создаётся только при пустой БД) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # --- HTTP и hostname ---
      KC_HTTP_ENABLED: "true" # Разрешаем plain HTTP, TLS для локалки не нужен
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false" # Не требуем совпадения hostname с заголовками запроса
      KC_PROXY_HEADERS: xforwarded # Учитываем X-Forwarded-*, если впереди появится reverse proxy
      # --- Наблюдаемость ---
      KC_HEALTH_ENABLED: "true" # Включает /health/* на management-порту 9000
      KC_METRICS_ENABLED: "true" # Включает /metrics на management-порту 9000
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL}
    ports:
      - "${KEYCLOAK_HTTP_PORT}:8080" # Админка и OIDC-эндпоинты
      - "${KEYCLOAK_MGMT_PORT}:9000" # Management-порт: health и metrics
    healthcheck: # В образе нет curl/wget, поэтому стучимся через bash /dev/tcp
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s # Первый старт дольше обычного: Keycloak накатывает свои миграции
    depends_on:
      postgres_keycloak:
        condition: service_healthy # Не стартуем, пока база не готова принимать соединения
    restart: unless-stopped
    networks:
      - keycloak-network # Приватная сеть пары keycloak + postgres
      - microservices-net # Общая сеть, чтобы Go-сервисы видели Keycloak по DNS-имени

networks:
  keycloak-network:
    driver: bridge # Обычная bridge-сеть Docker
  microservices-net:
    name: microservices-net
    external: true # Создаётся core-стеком, поэтому сначала `task up-core`

volumes:
  kc_pgdata: # Volume для данных базы Keycloak, Docker создаст его автоматически
