services:
  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME} # Один инстанс для всех микросервисов
    env_file:
      - .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data # Volume для персистентности (AOF), Docker создаст его автоматически
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped # Автоматический перезапуск контейнера, кроме ручной остановки
    networks:
      - microservices-net # Общая сеть, чтобы Go-сервисы видели Redis по DNS-имени "redis"

networks:
  microservices-net:
    name: microservices-net
    external: true # Создаётся core-стеком, поэтому сначала `task up-core`

volumes:
  redis_data:
