datacatalogue.comment="Данные для микросервиса DATACATALOGUE"
datacatalogue.host_and_port.comment="GRPC host and port"
datacatalogue.host_and_port.DATACATALOGUE_GRPC_HOST="${DATACATALOGUE_GRPC_HOST}"
datacatalogue.host_and_port.DATACATALOGUE_GRPC_PORT="${DATACATALOGUE_GRPC_PORT}"
datacatalogue.logger.comment="Logger settings"
datacatalogue.logger.DATACATALOGUE_LOGGER_LEVEL="info"
datacatalogue.logger.DATACATALOGUE_LOGGER_AS_JSON="true"
datacatalogue.db.comment="Postgres DB settings"
datacatalogue.db.DATACATALOGUE_CONTAINER_NAME="datacomradepostgres"
datacatalogue.db.DATACATALOGUE_POSTGRES_IMAGE="postgres:18.3-alpine3.23"
datacatalogue.db.DATACATALOGUE_POSTGRES_USER="${DATACATALOGUE_POSTGRES_USER}"
datacatalogue.db.DATACATALOGUE_POSTGRES_PASSWORD="${DATACATALOGUE_POSTGRES_PASSWORD}"
datacatalogue.db.DATACATALOGUE_POSTGRES_HOST="${DATACATALOGUE_POSTGRES_HOST}"
datacatalogue.db.DATACATALOGUE_POSTGRES_PORT="${DATACATALOGUE_POSTGRES_PORT}"
datacatalogue.db.DATACATALOGUE_POSTGRES_DB="${DATACATALOGUE_POSTGRES_DB}"
datacatalogue.db.DB_MAX_OPEN_CONNS=50
datacatalogue.db.DB_MAX_IDLE_CONNS=50
datacatalogue.db.DB_MAX_IDLE_TIME_MINS=5
datacatalogue.goose.comment="Миграции в go/goose"
datacatalogue.goose.GOOSE_DRIVER="postgres"
datacatalogue.goose.GOOSE_DBSTRING="postgres://${DATACATALOGUE_POSTGRES_USER}:${DATACATALOGUE_POSTGRES_PASSWORD}@${DATACATALOGUE_POSTGRES_HOST}:${DATACATALOGUE_POSTGRES_PORT}/${DATACATALOGUE_POSTGRES_DB}"
datacatalogue.goose.GOOSE_MIGRATION_DIR="./db/migrations"
datacatalogue.goose.GOOSE_TABLE="tech.goose_migrations"

keycloak.comment="Данные для сервиса авторизации KEYCLOAK"
keycloak.db.comment="Postgres DB settings (отдельная база под Keycloak)"
keycloak.db.KEYCLOAK_POSTGRES_CONTAINER_NAME="keycloak_postgres"
keycloak.db.KEYCLOAK_POSTGRES_IMAGE="postgres:18.3-alpine3.23"
keycloak.db.KEYCLOAK_POSTGRES_USER="keycloak_user"
keycloak.db.KEYCLOAK_POSTGRES_PASSWORD="keycloak_pass"
keycloak.db.KEYCLOAK_POSTGRES_DB="keycloak"
keycloak.db.KEYCLOAK_POSTGRES_PORT=5433
keycloak.service.comment="Keycloak server settings. Админка и OIDC: http://localhost:8081"
keycloak.service.KEYCLOAK_CONTAINER_NAME="keycloak"
keycloak.service.KEYCLOAK_IMAGE="quay.io/keycloak/keycloak:26.4"
keycloak.service.KEYCLOAK_HTTP_PORT=8081
keycloak.service.KEYCLOAK_MGMT_PORT=9000
keycloak.service.KEYCLOAK_HOSTNAME="localhost"
keycloak.service.KEYCLOAK_LOG_LEVEL="info"
keycloak.admin.comment="Первичный администратор. Создаётся ТОЛЬКО при первом старте на пустой БД. Смена значений после инициализации ни на что не влияет — нужно либо менять пароль в админке, либо удалять volume kc_pgdata."
keycloak.admin.KEYCLOAK_ADMIN_USER="admin"
keycloak.admin.KEYCLOAK_ADMIN_PASSWORD="admin"

redis.comment="Redis server settings. Один инстанс на все микросервисы, разделение — по namespace (префиксам ключей),"
redis.db.comment="Redis Image"
redis.db.REDIS_CONTAINER_NAME="datacomrade"
redis.db.REDIS_IMAGE="redis:7.4-alpine"
redis.db.REDIS_PORT="${REDIS_PORT}"
redis.db.REDIS_PASSWORD="${REDIS_PASSWORD}"
redis.memory.comment="Память и вытеснение ключей. allkeys-lru — вытесняем наименее используемые ключи любого сервиса при достижении лимита"
redis.memory.REDIS_MAXMEMORY="256mb"
redis.memory.REDIS_MAXMEMORY_POLICY="allkeys-lru"

shepherd.comment="Данные для микросервиса SHEPHERD (API Gateway)"
shepherd.http.comment="HTTP server settings"
shepherd.http.SHEPHERD_HTTP_PORT=8080
shepherd.logger.comment="Logger settings"
shepherd.logger.SHEPHERD_LOGGER_LEVEL="info"
shepherd.logger.SHEPHERD_LOGGER_AS_JSON="true"
shepherd.cors.comment="CORS: allowlist origin'ов фронтенда через запятую"
shepherd.cors.SHEPHERD_CORS_ORIGINS="http://localhost:5173"
shepherd.keycloak.comment="# Keycloak: issuer realm'а, из него же вычисляется JWKS-адрес. Реалм datacomrade и роли admin/maintainer/viewer нужно завести в Keycloak вручную — этот .env их не создаёт."
shepherd.keycloak.SHEPHERD_KEYCLOAK_ISSUER_URL="http://localhost:8081/realms/datacomrade"
shepherd.swaggeropenapi.comment="Swagger UI и /openapi.yaml — выключить в production"
shepherd.swaggeropenapi.SHEPHERD_ENABLE_DOCS="true"
shepherd.redis.comment="Redis: адрес хоста свой, порт и пароль — общие для всех микросервисов, см. deploy/compose/redis/.env"
shepherd.redis.SHEPHERD_REDIS_HOST="localhost"
shepherd.redis.REDIS_PORT="${REDIS_PORT}"
shepherd.redis.REDIS_PASSWORD="${REDIS_PASSWORD}"
shepherd.microservices.comment="Данные для других микросервисов"
shepherd.microservices.DATACATALOGUE_GRPC_HOST="${DATACATALOGUE_GRPC_HOST}"
shepherd.microservices.DATACATALOGUE_GRPC_PORT="${DATACATALOGUE_GRPC_PORT}"
