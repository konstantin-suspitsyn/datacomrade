# СГЕНЕРИРОВАННЫЙ ФАЙЛ — НЕ РЕДАКТИРОВАТЬ.
# Собран из api/openapi/v1/spec/*.yaml командой `task openapi:bundle`.
# Правки вносить в spec/<пакет>.yaml, затем `task openapi:gen`.
openapi: 3.0.3
info:
  title: Shepherd API
  description: |-
    REST-контракт API Gateway (contract-first). Источник истины — файлы в
    api/openapi/v1/spec, разбитые по пакетам микросервиса datacatalogue:
    user.yaml (userapiv1), tables.yaml (tablesapiv1),
    user_domain_roles.yaml (userdomainrolesapiv1) и общий common.yaml.
    `task openapi:gen` собирает их в api/openapi/v1/openapi.yaml и генерирует
    internal/api/openapiv1 через oapi-codegen. Править openapi.yaml руками нельзя.
    См. documentation/readme_obsidian/datacomrade/01_architecture/API Gateway.md
  version: 1.0.0
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Текущий аутентифицированный пользователь
      description: >
        Identity из Bearer-токена Keycloak, дополненная user_id из Metadata Service. Только читает dc.user — не
        создаёт: если строки ещё нет, отвечает 404, вызывающий должен сначала сходить в POST /login.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Не аутентифицирован — отсутствует или недействителен токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь ещё не создан в Metadata Service — сначала вызовите POST /login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      operationId: login
      summary: Получить или создать пользователя dc.user
      description: >
        Резолвит dc.user по external_id (=sub из Keycloak); если записи ещё нет — создаёт её. Единственная ручка,
        которая пишет в Metadata Service при первом входе пользователя — см. «Автосоздание пользователя» в API Gateway.md.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Не аутентифицирован — отсутствует или недействителен токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hosts:
    get:
      operationId: listHosts
      summary: Страница строк dc.host
      description: >
        Требуется роль admin или maintainer. order/page_limit по умолчанию — см. pagination.DefaultOrder/DefaultPageLimit
        в shepherd.
      parameters:
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageLimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createHost
      summary: Создать строку dc.host
      description: Требуется роль admin или maintainer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Строка с такими уникальными полями уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hosts/search:
    get:
      operationId: searchHosts
      summary: Страница строк dc.host по подстроке имени
      description: Требуется роль admin или maintainer.
      parameters:
        - name: search_name
