  /olap-queries:
    post:
      operationId: createOlapQuery
      summary: Сохранить конфигурацию OLAP-сводной
      description: |
        Принимает тело конструктора (version, filters, rows, columns, measures, order_by, limit) и целевую базу database_id, резолвит форму в бизнес-домен, собирает финальный SQL, сохраняет запрос в query_engine и возвращает созданную строку queries.queries. created_by подставляется из claims токена.

        Если алиасы формы встречаются в нескольких доменах, а domain_id в теле не задан — ответ 409 со списком доменов на выбор; ничего не сохраняется. Фронтенд показывает выбор и повторяет запрос с заполненным domain_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OlapQueryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OlapQueryRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Пользователь ещё не создан в Metadata Service — сначала вызовите POST /login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Алиасы формы встречаются в нескольких доменах, а domain_id не задан. Тело — список доменов на выбор;
            запрос не сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OlapDomainChoice'
        '422':
          description: Форма не прошла валидацию каталога (недоступный алиас, недопустимая агрегация, алиас вне
            домена).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OlapValidationError'
  /olap-queries/{id}:
    get:
      operationId: getOlapQueryById
      summary: Сохранённая строка queries.queries по id
      description: Возвращает ранее сохранённую конфигурацию OLAP-сводной вместе с собранным SQL и его параметрами.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OlapQueryRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
