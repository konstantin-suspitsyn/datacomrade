version: "3"

# Глобальные переменные проекта
vars:
  GO_VERSION: "1.25.0"
  GOLANGCI_LINT_VERSION: "v2.11.3"
  GCI_VERSION: "v0.14.0"
  GOFUMPT_VERSION: "v0.9.2"
  BUF_VERSION: "1.53.0"
  PROTOC_GEN_GO_VERSION: "v1.36.6"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.5.1"
  OAPI_CODEGEN_VERSION: "v2.8.0"
  SQLC_VERSION: "v1.31.1"

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  ENVDIR: "{{.ROOT_DIR}}/deploy/env"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  BUF: "{{.BIN_DIR}}/buf"
  MODULES: datacatalogue shepherd
  SERVICES: datacatalogue shepherd
  PROTOC_GEN_GO: "{{.BIN_DIR}}/protoc-gen-go"
  PROTOC_GEN_GO_GRPC: "{{.BIN_DIR}}/protoc-gen-go-grpc"
  GRPCURL: "{{.BIN_DIR}}/grpcurl"
  OAPI_CODEGEN: "{{.BIN_DIR}}/oapi-codegen"
  SQLC: "{{.BIN_DIR}}/sqlc"

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    summary: |
      Эта задача проверяет наличие инструментов форматирования кода gofumpt и gci в директории bin.
      Если инструменты не найдены, они будут автоматически установлены с указанными версиями.

      Используется:
        - gofumpt: для форматирования кода Go
        - gci: для сортировки импортов Go
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci, исключая mocks"
    summary: |
      Форматирует все Go-файлы проекта с использованием gofumpt для стандартизации кода
      и gci для сортировки импортов, исключая файлы в директориях mocks.

      Использует инструменты:
        - gofumpt: для стандартизации форматирования
        - gci: для сортировки импортов по стандартным группам
    deps: [install-formatters]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."

        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🧼 Форматируем $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
          fi
        done
      - |
        echo "🎯 Сортируем импорты через gci ..."

        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🎯 Сортируем импорты в $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(https://github.com/konstantin-suspitsyn/datacomrade/)" {} +
          fi
        done

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    summary: |
      Проверяет наличие golangci-lint в директории bin.
      Если инструмент не найден, автоматически устанавливает его через go install.

      Устанавливаемая версия: {{.GOLANGCI_LINT_VERSION}}
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    summary: |
      Запускает линтер golangci-lint для всех модулей проекта.
      Линтер проверяет код на соответствие стандартам качества и лучшим практикам.
      Проверка включает проверку безопасности через gosec (встроенный в golangci-lint).

      Зависимости:
        - install-golangci-lint: автоматически устанавливает линтер
        - format: форматирует код перед проверкой
    deps: [install-golangci-lint]
    vars:
      MODULES: "{{.MODULES}}"
      GOLANGCI_LINT: "{{.GOLANGCI_LINT}}"
    cmds:
      - |
        set -e
        ERR=0
        echo "🔍 Линтим все модули ..."
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🔍 Линтим $mod module"
            {{.GOLANGCI_LINT}} run $mod/... --config=.golangci.yml || ERR=1
          fi
        done
        exit $ERR

  install-buf:
    desc: "Устанавливает Buf в каталог bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.BUF}} ] || {
          echo '📦 Устанавливаем buf {{.BUF_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
        }
    status:
      - test -x {{.BUF}}

  proto:install-plugins:
    desc: "Устанавливает protoc плагины в каталог bin"
    cmds:
      - |
        [ -f {{.PROTOC_GEN_GO}} ] || {
          echo '📦 Installing protoc-gen-go...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        }
        [ -f {{.PROTOC_GEN_GO_GRPC}} ] || {
          echo '📦 Installing protoc-gen-go-grpc...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
        }

  proto:lint:
    deps: [install-buf, proto:install-plugins]
    desc: Проверка .proto-файлов на соответствие стилю
    dir: shared/proto
    cmds:
      - "{{.BUF}} lint"

  proto:gen:
    deps: [install-buf, proto:install-plugins, proto:lint]
    desc: Генерация Go-кода из .proto
    dir: shared/proto
    cmds:
      - "{{.BUF}} generate"

  openapi:install-plugins:
    desc: "Устанавливает oapi-codegen в каталог bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.OAPI_CODEGEN}} ] || {
          echo '📦 Устанавливаем oapi-codegen {{.OAPI_CODEGEN_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
        }
    status:
      - test -x {{.OAPI_CODEGEN}}

  openapi:gen:
    deps: [openapi:install-plugins]
    desc: "Генерация Go-кода (types + chi ServerInterface) из OpenAPI-спеки Shepherd"
    dir: shepherd
    cmds:
      - "{{.OAPI_CODEGEN}} -config api/openapi/v1/oapi-codegen.config.yaml api/openapi/v1/openapi.yaml"

  sqlc:install-plugins:
    desc: "Устанавливает sqlc в каталог bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.SQLC}} ] || {
          echo '📦 Устанавливаем sqlc {{.SQLC_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
        }
    status:
      - test -x {{.SQLC}}

  sqlc:gen:
    desc: "Генерирует код sqlc для всех микросервисов — запускает под-таски sqlc:gen:<микросервис>"
    cmds:
      - task: sqlc:gen:datacatalogue

  sqlc:gen:datacatalogue:
    deps: [sqlc:install-plugins]
    desc: "Генерация Go-кода sqlc для datacatalogue (Data Catalog)"
    dir: datacatalogue/db/sqlc
    cmds:
      - "{{.SQLC}} generate"

  env:install-envsubst:
    desc: "Устанавливает envsubst для замены переменных в конфигурации"
    cmds:
      - |
        [ -f {{.ENVSUBST}} ] || {
          echo "📦 Устанавливаем envsubst версии {{.ENVSUBST_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/a8m/envsubst/cmd/envsubst@{{.ENVSUBST_VERSION}}
        }
        echo "✅ envsubst установлен: {{.ENVSUBST}}"

  env:generate:
    desc: "Генерирует .env файлы для всех сервисов из шаблонов и единого файла конфигурации"
    deps: [env:install-envsubst]
    cmds:
      - |
        ENV_FILE="{{.ENVDIR}}/.env"
        TEMPLATE_FILE="{{.ENVDIR}}/.env.template"
        SCRIPT="{{.ENVDIR}}/generate-env.sh"

        if [ ! -f "$ENV_FILE" ]; then
          if [ -f "$TEMPLATE_FILE" ]; then
            echo "🔄 Файл $ENV_FILE не найден, создаем из шаблона $TEMPLATE_FILE"
            cp "$TEMPLATE_FILE" "$ENV_FILE"
            echo "✅ Создан файл $ENV_FILE. Проверьте и отредактируйте значения переменных при необходимости."
          else
            echo "❌ Шаблон $TEMPLATE_FILE не найден!"
            exit 1
          fi
        fi

        chmod +x "$SCRIPT"
        # Передаем список сервисов в виде строки с разделителями-запятыми
        export SERVICES="{{.SERVICES}}"
        export ENV_FILE="$ENV_FILE"
        ENV_SUBST={{.ENVSUBST}} "$SCRIPT" services

  up-core:
    desc: Поднять core-контейнер
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🚀 Поднмаем core контейнеры"
      - docker compose up --build --detach

  down-core:
    desc: Убиваем core-контейнер
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🛑 Останавливаем core контейнеры"
      - docker compose down

  up-datacatalogue:
    desc: Поднять datacatalogue-контейнер
    dir: deploy/compose/datacatalogue
    cmds:
      - echo "[task] 🚀 Поднимаем datacatalogue контейнеры"
      - docker compose up --build --detach

  down-datacatalogue:
    desc: Убиваем datacatalogue-контейнер
    dir: deploy/compose/datacatalogue
    cmds:
      - echo "[task] 🛑 Останавливаем core контейнеры"
      - docker compose down

  up-keycloak:
    desc: Поднять keycloak-контейнеры
    dir: deploy/compose/keycloak
    cmds:
      - echo "[task] 🚀 Поднимаем keycloak контейнеры"
      - docker compose up --build --detach

  down-keycloak:
    desc: Убиваем keycloak-контейнеры
    dir: deploy/compose/keycloak
    cmds:
      - echo "[task] 🛑 Останавливаем keycloak контейнеры"
      - docker compose down

  up-redis:
    desc: Поднять redis-контейнер
    dir: deploy/compose/redis
    cmds:
      - echo "[task] 🚀 Поднимаем redis контейнер"
      - docker compose up --build --detach

  down-redis:
    desc: Убиваем redis-контейнер
    dir: deploy/compose/redis
    cmds:
      - echo "[task] 🛑 Останавливаем redis контейнер"
      - docker compose down

  up-all:
    desc: Поднять все контейнеры
    cmds:
      - task up-core
      - task up-datacatalogue
      - task up-keycloak
      - task up-redis

  down-all:
    desc: Поднять все контейнеры
    cmds:
      - task down-redis
      - task down-keycloak
      - task down-datacatalogue
      - task down-core
