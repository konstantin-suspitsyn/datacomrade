syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/konstantin-suspitsyn/datacomrade/shared/pkg/proto/user/v1;userv1";

// UserService mirrors query.sql one-to-one:
// 8 standard CRUD calls per table.
service UserService {
  // dc.user
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetDeletedUserById(GetDeletedUserByIdRequest) returns (GetDeletedUserByIdResponse);
  rpc GetDeletedUsers(GetDeletedUsersRequest) returns (GetDeletedUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUserById(UpdateUserByIdRequest) returns (UpdateUserByIdResponse);
  rpc DeleteUserById(DeleteUserByIdRequest) returns (DeleteUserByIdResponse);
  rpc UndeleteUserById(UndeleteUserByIdRequest) returns (UndeleteUserByIdResponse);
}

// =========================================================
// dc.user
// =========================================================

// User is a full row of dc.user.
message User {
  int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool is_deleted = 5;
  int64 incoming_user_id = 6;
}

// GetUserByIdRequest asks for a single active dc.user row by id (query GetUserById).
message GetUserByIdRequest {
  int64 id = 1;
}

// GetUserByIdResponse returns a single active dc.user row (query GetUserById).
message GetUserByIdResponse {
  User user = 1;
}

// GetUsersRequest asks for every active dc.user row (query GetUsers).
message GetUsersRequest {}

// GetUsersResponse returns every active dc.user row (query GetUsers).
message GetUsersResponse {
  repeated User users = 1;
}

// GetDeletedUserByIdRequest asks for a single soft deleted dc.user row by id (query GetDeletedUserById).
message GetDeletedUserByIdRequest {
  int64 id = 1;
}

// GetDeletedUserByIdResponse returns a single soft deleted dc.user row (query GetDeletedUserById).
message GetDeletedUserByIdResponse {
  User user = 1;
}

// GetDeletedUsersRequest asks for every soft deleted dc.user row (query GetDeletedUsers).
message GetDeletedUsersRequest {}

// GetDeletedUsersResponse returns every soft deleted dc.user row (query GetDeletedUsers).
message GetDeletedUsersResponse {
  repeated User users = 1;
}

// CreateUserRequest carries the fields needed to insert a dc.user row (query CreateUser).
message CreateUserRequest {
  string name = 1;
  int64 incoming_user_id = 2;
}

// CreateUserResponse returns the created dc.user row (query CreateUser).
message CreateUserResponse {
  User user = 1;
}

// UpdateUserByIdRequest carries the fields to update on a dc.user row (query UpdateUserById).
message UpdateUserByIdRequest {
  int64 id = 1;
  string name = 2;
  int64 incoming_user_id = 3;
}

// UpdateUserByIdResponse returns the updated dc.user row (query UpdateUserById).
message UpdateUserByIdResponse {
  User user = 1;
}

// DeleteUserByIdRequest asks to soft delete a dc.user row by id, setting is_deleted = true (query DeleteUserById).
message DeleteUserByIdRequest {
  int64 id = 1;
}

// DeleteUserByIdResponse carries no payload (query DeleteUserById).
message DeleteUserByIdResponse {
  google.protobuf.Empty empty = 1;
}

// UndeleteUserByIdRequest asks to restore a soft deleted dc.user row by id, setting is_deleted = false (query UndeleteUserById).
message UndeleteUserByIdRequest {
  int64 id = 1;
}

// UndeleteUserByIdResponse carries no payload (query UndeleteUserById).
message UndeleteUserByIdResponse {
  google.protobuf.Empty empty = 1;
}
