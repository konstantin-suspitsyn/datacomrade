// Файл сгенерирован программой SG Buddy https://github.com/konstantin-suspitsyn/sg_buddy
// Правки будут затёрты при следующей генерации: правьте настройки, а не этот файл.

syntax = "proto3";

package olap_exchange.v1;

option go_package = "github.com/konstantin-suspitsyn/datacomrade/shared/pkg/proto/olap_exchange/v1;olapexchangev1";

// =========================================================
// dc.alias
// =========================================================

service AliasService {
  rpc GetOlapAliases(GetOlapAliasesRequest) returns (GetOlapAliasesResponse);
}

// Выборка GetOlapAliases: параметры вызова. Порядок по умолчанию — id.
message GetOlapAliasesRequest {
  string external_id = 1;
  // допустимые значения: ASC, DESC
  string order = 2;
}

// Выборка GetOlapAliases: строка ответа — только отмеченные колонки.
message GetOlapAliasesRow {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool is_deleted = 4;
  int64 column_type_id = 5;
  string column_type_name = 6;
  string column_type_description = 7;
}

// Выборка GetOlapAliases: все найденные строки.
message GetOlapAliasesResponse {
  repeated GetOlapAliasesRow rows = 1;
}

// =========================================================
// dc.column_cat
// =========================================================

service ColumnCatService {
  rpc GetTablesMeta(GetTablesMetaRequest) returns (GetTablesMetaResponse);
}

// Выборка GetTablesMeta: параметры вызова. Порядок по умолчанию — id.
message GetTablesMetaRequest {
  string alias_ids_list = 1;
  string external_id = 2;
  // допустимые значения: ASC, DESC
  string order = 3;
}

// Выборка GetTablesMeta: строка ответа — только отмеченные колонки.
message GetTablesMetaRow {
  int64 id = 1;
  int64 table_id = 2;
  string name = 3;
  int64 alias_id = 4;
  int64 column_type_id = 5;
  string description = 6;
  int64 calculation_type_id = 7;
  int64 table_cat_id = 8;
  string table_cat_name = 9;
  int64 domain_cat_id = 10;
  string domain_cat_domain_name = 11;
  int64 table_type_id = 12;
  string table_type_name = 13;
  int64 schema_cat_id = 14;
  string schema_cat_name = 15;
  int64 database_cat_id = 16;
  string database_cat_name = 17;
  int64 database_type_id = 18;
  string database_type_name = 19;
  string database_type_db_version = 20;
}

// Выборка GetTablesMeta: все найденные строки.
message GetTablesMetaResponse {
  repeated GetTablesMetaRow rows = 1;
}
