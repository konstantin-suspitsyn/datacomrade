  repeated Host data = 1;
  Pagination pagination = 2;
}

// Выборка GetHostDeleted: параметры вызова. Порядок по умолчанию — id.
message GetHostDeletedRequest {
  // допустимые значения: ASC, DESC
  string order = 1;
  int32 page_limit = 2;
  int32 page = 3;
}

// Выборка GetHostDeleted: страница данных и пагинация.
message GetHostDeletedResponse {
  repeated Host data = 1;
  Pagination pagination = 2;
}

// Изменение UpdateHostById: параметры вызова.
message UpdateHostByIdRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string host_env = 4;
  string port_env = 5;
  string username_env = 6;
  string password_env = 7;
