}

// Строка таблицы dc.user: все колонки, как их вернёт SELECT *.
message User {
  optional int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool is_deleted = 5;
  string external_id = 6;
}

// Вставка CreateUser: параметры вызова.
message CreateUserRequest {
  string name = 1;
  string external_id = 2;
}

// Вставка CreateUser: одна строка.
message CreateUserResponse {
  User user = 1;
}

// Выборка GetUserByExternalId: параметры вызова.
message GetUserByExternalIdRequest {
  string external_id = 1;
}

// Выборка GetUserByExternalId: одна строка.
message GetUserByExternalIdResponse {
  User user = 1;
}

// Выборка GetUsers: параметры вызова. Порядок по умолчанию — id.
message GetUsersRequest {
  // допустимые значения: ASC, DESC
  string order = 1;
  int32 page_limit = 2;
  int32 page = 3;
}

// Выборка GetUsers: страница данных и пагинация.
message GetUsersResponse {
  repeated User data = 1;
  Pagination pagination = 2;
}

// =========================================================
// dc.host
// =========================================================

service HostService {
  rpc CreateHost(CreateHostRequest) returns (CreateHostResponse);
  rpc GetHostById(GetHostByIdRequest) returns (GetHostByIdResponse);
  rpc GetHosts(GetHostsRequest) returns (GetHostsResponse);
  rpc GetHostsSearchName(GetHostsSearchNameRequest) returns (GetHostsSearchNameResponse);
  rpc GetHostDeleted(GetHostDeletedRequest) returns (GetHostDeletedResponse);
  rpc UpdateHostById(UpdateHostByIdRequest) returns (UpdateHostByIdResponse);
  rpc DeleteHostById(DeleteHostByIdRequest) returns (DeleteHostByIdResponse);
  rpc UndeleteHostById(UndeleteHostByIdRequest) returns (UndeleteHostByIdResponse);
}

// Строка таблицы dc.host: все колонки, как их вернёт SELECT *.
message Host {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string host_env = 4;
  string port_env = 5;
  string username_env = 6;
  string password_env = 7;
  bool is_deleted = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 user_id = 11;
}

// Вставка CreateHost: параметры вызова.
message CreateHostRequest {
  string name = 1;
  string description = 2;
  string host_env = 3;
  string port_env = 4;
  string username_env = 5;
  string password_env = 6;
  string external_id = 7;
}

// Вставка CreateHost: одна строка.
message CreateHostResponse {
  Host host = 1;
}

// Выборка GetHostById: параметры вызова.
message GetHostByIdRequest {
  int64 id = 1;
}

// Выборка GetHostById: одна строка.
message GetHostByIdResponse {
