// Alias is a full row of dc.alias.
message Alias {
  int64 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool is_deleted = 6;
  int64 user_id = 7;
}

// GetAliasByIdRequest asks for a single active dc.alias row by id (query GetAliasById).
message GetAliasByIdRequest {
  int64 id = 1;
}

// GetAliasByIdResponse returns a single active dc.alias row (query GetAliasById).
message GetAliasByIdResponse {
  Alias alias = 1;
}

// GetAliasesRequest asks for every active dc.alias row (query GetAliases).
message GetAliasesRequest {}

// GetAliasesResponse returns every active dc.alias row (query GetAliases).
message GetAliasesResponse {
  repeated Alias aliases = 1;
}

// GetDeletedAliasByIdRequest asks for a single soft deleted dc.alias row by id (query GetDeletedAliasById).
