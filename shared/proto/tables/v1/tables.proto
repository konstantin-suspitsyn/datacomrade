}

// Выборка GetHosts: параметры вызова. Порядок по умолчанию — id.
message GetHostsRequest {
  // допустимые значения: ASC, DESC
  string order = 1;
  int32 page_limit = 2;
  int32 page = 3;
}

// Выборка GetHosts: страница данных и пагинация.
