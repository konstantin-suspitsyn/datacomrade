message GetDeletedAliasesRequest {}

// GetDeletedAliasesResponse returns every soft deleted dc.alias row (query GetDeletedAliases).
message GetDeletedAliasesResponse {
  repeated Alias aliases = 1;
}

// CreateAliasRequest carries the fields needed to insert a dc.alias row (query CreateAlias).
message CreateAliasRequest {
  string name = 1;
  string description = 2;
  string user_external_id = 3;
}

// CreateAliasResponse returns the created dc.alias row (query CreateAlias).
message CreateAliasResponse {
  Alias alias = 1;
}

// UpdateAliasByIdRequest carries the fields to update on a dc.alias row (query UpdateAliasById).
message UpdateAliasByIdRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string user_external_id = 4;
}

// UpdateAliasByIdResponse returns the updated dc.alias row (query UpdateAliasById).
message UpdateAliasByIdResponse {
  Alias alias = 1;
}

// DeleteAliasByIdRequest asks to soft delete a dc.alias row by id, setting is_deleted = true (query DeleteAliasById).
message DeleteAliasByIdRequest {
  int64 id = 1;
}

// DeleteAliasByIdResponse carries no payload (query DeleteAliasById).
message DeleteAliasByIdResponse {
  google.protobuf.Empty empty = 1;
}

// UndeleteAliasByIdRequest asks to restore a soft deleted dc.alias row by id, setting is_deleted = false (query UndeleteAliasById).
message UndeleteAliasByIdRequest {
  int64 id = 1;
}

// UndeleteAliasByIdResponse carries no payload (query UndeleteAliasById).
message UndeleteAliasByIdResponse {
  google.protobuf.Empty empty = 1;
}

