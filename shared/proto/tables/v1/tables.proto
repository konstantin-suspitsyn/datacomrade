syntax = "proto3";

package tables.v1;

option go_package = "github.com/konstantin-suspitsyn/datacomrade/shared/pkg/proto/tables_model/tables/v1;tablesv1";

import "google/protobuf/timestamp.proto";

// Постраничность: одна на файл, поля одни и те же везде.
message Pagination {
  int32 page = 1;
  int32 per_page = 2;
  int64 total_items = 3;
  int64 total_pages = 4;
}

// =========================================================
// dc.alias
// =========================================================

service AliasService {
  rpc CreateAlias(CreateAliasRequest) returns (CreateAliasResponse);
  rpc GetAliasById(GetAliasByIdRequest) returns (GetAliasByIdResponse);
  rpc GetAliasesDeleted(GetAliasesDeletedRequest) returns (GetAliasesDeletedResponse);
  rpc GetAliases(GetAliasesRequest) returns (GetAliasesResponse);
  rpc UpdateAliasById(UpdateAliasByIdRequest) returns (UpdateAliasByIdResponse);
  rpc DeleteAliasById(DeleteAliasByIdRequest) returns (DeleteAliasByIdResponse);
  rpc UndeleteAliasById(UndeleteAliasByIdRequest) returns (UndeleteAliasByIdResponse);
}

// Строка таблицы dc.alias: все колонки, как их вернёт SELECT *.
message Alias {
  int64 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool is_deleted = 6;
  int64 user_id = 7;
}

// Вставка CreateAlias: параметры вызова.
message CreateAliasRequest {
  string name = 1;
  string description = 2;
  string external_id = 3;
}

// Вставка CreateAlias: одна строка.
message CreateAliasResponse {
  Alias alias = 1;
}

// Выборка GetAliasById: параметры вызова.
message GetAliasByIdRequest {
  int64 id = 1;
}

// Выборка GetAliasById: одна строка.
message GetAliasByIdResponse {
  Alias alias = 1;
}

// Выборка GetAliasesDeleted: параметры вызова. Порядок по умолчанию — id.
message GetAliasesDeletedRequest {
  // допустимые значения: ASC, DESC
  string order = 1;
  int32 page_limit = 2;
  int32 page = 3;
}

// Выборка GetAliasesDeleted: страница данных и пагинация.
message GetAliasesDeletedResponse {
  repeated Alias data = 1;
  Pagination pagination = 2;
}

// Выборка GetAliases: параметры вызова. Порядок по умолчанию — id.
message GetAliasesRequest {
  // допустимые значения: ASC, DESC
  string order = 1;
  int32 page_limit = 2;
  int32 page = 3;
}

// Выборка GetAliases: страница данных и пагинация.
message GetAliasesResponse {
  repeated Alias data = 1;
  Pagination pagination = 2;
}

// Изменение UpdateAliasById: параметры вызова.
message UpdateAliasByIdRequest {
  string name = 1;
  string description = 2;
  bool is_deleted = 3;
  string external_id = 4;
  int64 id = 5;
}

// Изменение UpdateAliasById: ответ пустой — запрос ничего не возвращает.
message UpdateAliasByIdResponse {}

// Мягкое удаление DeleteAliasById: параметры вызова.
message DeleteAliasByIdRequest {
  string external_id = 1;
  int64 id = 2;
}

// Мягкое удаление DeleteAliasById: ответ пустой — запрос ничего не возвращает.
message DeleteAliasByIdResponse {}

// Обратное удаление UndeleteAliasById: параметры вызова.
message UndeleteAliasByIdRequest {
  string external_id = 1;
  int64 id = 2;
}

// Обратное удаление UndeleteAliasById: ответ пустой — запрос ничего не возвращает.
message UndeleteAliasByIdResponse {}

